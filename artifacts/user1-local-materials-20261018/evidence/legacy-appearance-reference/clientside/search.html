<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Events | Harbour Hope Charity</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="Harbour Hope Charity home">
        <span class="brand-mark" aria-hidden="true">HH</span>
        <span>
          <span class="brand-name">Harbour Hope</span>
          <span class="brand-subtitle">Charity events</span>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        Menu
      </button>
      <div class="nav-links" id="primary-navigation">
        <a href="index.html">Home</a>
        <a href="search.html">Search events</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <p class="eyebrow">Find an event</p>
      <h1>Search by date, location, or category.</h1>
    </section>

    <section class="content-section two-column-layout">
      <form class="filter-panel" id="search-form">
        <label for="event-date">Date</label>
        <input id="event-date" name="date" type="date">

        <label for="event-location">Location</label>
        <input id="event-location" name="location" type="text" placeholder="Brisbane">

        <label for="event-category">Category</label>
        <select id="event-category" name="categoryId">
          <option value="">All categories</option>
        </select>

        <div class="form-actions">
          <button class="button primary-button" type="submit">Search</button>
          <button class="button secondary-button" id="clear-filters" type="button">Clear filters</button>
        </div>
      </form>

      <div class="results-panel">
        <div class="status-message" id="search-status">
          Enter one or more filters, then search for matching events.
        </div>
        <div class="event-grid" id="search-results" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Harbour Hope Charity. Built for PROG2002 coursework.</p>
  </footer>
</body>
</html>
